name: CI

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]
    workflow_dispatch:

# Une execution suffit par branche : les pushes successifs annulent les runs
# devenus obsoletes.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # packages/calendar est un sous-module ET un paquet du
                  # workspace pnpm : sans lui, `pnpm install` ne peut pas
                  # resoudre `@taskgenius/calendar: workspace:*`.
                  submodules: recursive

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10

            - name: Get pnpm store directory
              shell: bash
              run: |
                  echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

            - name: Setup pnpm cache
              uses: actions/cache@v4
              with:
                  path: ${{ env.STORE_PATH }}
                  key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-pnpm-store-

            # Sans les scripts de preparation des paquets du workspace, tsc
            # sort de fausses erreurs TS2307/TS4112 sur les composants calendar.
            - name: Install dependencies
              run: pnpm install

            - name: Build workspace packages
              run: pnpm -r --filter=./packages/* run build

            - name: Typecheck
              run: pnpm exec tsc -noEmit -skipLibCheck

            # `pnpm run build` bundle en mode dev (sortie a la racine). On force
            # le mode production pour publier un artefact reellement installable
            # dans un vault : dist/{main.js,styles.css,manifest.json}.
            - name: Bundle (production)
              run: node esbuild.config.mjs production

            - name: Run tests
              run: pnpm exec jest --ci

            # Informatif : ces suites mesurent des durees d'horloge murale sur
            # un runner partage, donc non reproductibles. Elles ne peuvent pas
            # bloquer la CI, mais leurs mesures restent consultables dans le log.
            - name: Run performance suites (non bloquant)
              continue-on-error: true
              run: pnpm run test:perf

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: plugin-build
                  path: dist/
                  if-no-files-found: error
                  retention-days: 7
